<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc Land Registry — math tests</title>
<meta name="color-scheme" content="dark">
<style>
  body { background:#0c1116; color:#e6edf3; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
         margin:0; padding:28px 20px 60px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8b9aa8; margin:0 0 22px; font-size:13px; }
  #summary { font-size:20px; font-weight:700; padding:14px 18px; border-radius:10px; margin-bottom:20px; }
  .ok   { background:rgba(63,185,80,.1);  border:1px solid #3fb950; color:#3fb950; }
  .bad  { background:rgba(248,81,73,.1);  border:1px solid #f85149; color:#f85149; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:#8b9aa8;
       margin:24px 0 8px; border-top:1px solid #26313c; padding-top:14px; }
  .t { padding:5px 0; border-bottom:1px solid rgba(38,49,60,.5); display:flex; gap:10px; }
  .t .tag { flex:none; width:52px; font-weight:700; }
  .pass .tag { color:#3fb950; } .fail .tag { color:#f85149; }
  .t .msg { flex:1; }
  .t .why { color:#8b9aa8; }
  .fail .why { color:#f85149; }
  a { color:#f7931a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arc Land Registry — math tests</h1>
  <p class="sub">Runs the pure functions in <code>app.js</code> and <code>globe.js</code> in this browser. No Node, no runner.
     &nbsp;<a href="index.html">&larr; back to the site</a></p>
  <div id="summary">running…</div>
  <div id="out"></div>
</div>

<!-- Load app.js for its pure functions only; this flag skips the DOM layer. -->
<script src="test-flag.js"></script>
<script src="whales.js"></script>
<script src="app.js"></script>
<script src="price.js"></script>
<!-- arc.js before iso.js: the board's world view calls into the Arc helpers. -->
<script src="arc.js"></script>
<script src="stables.js"></script>
<script src="iso.js"></script>
<script src="globe.js"></script>

<script src="tests.js"></script>
</body>
</html>
