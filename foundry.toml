[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Arc targets the Osaka hard fork as its baseline and ships selected Amsterdam
# features ahead of upstream (notably EIP-7708 Transfer logs for native value
# movements). See https://docs.arc.io/arc/references/evm-differences
evm_version = "osaka"

optimizer = true
optimizer_runs = 200

# Arc Testnet. Both docs.arc.io (rpc.testnet.arc.io) and the use-arc skill
# (rpc.testnet.arc.network) resolve and return chain id 0x4cef52 from Jakarta,
# verified 2026-08-06. docs.arc.io is treated as authoritative; the rest are
# documented fallbacks.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_testnet_blockdaemon = "https://rpc.blockdaemon.testnet.arc.io"
arc_testnet_drpc = "https://rpc.drpc.testnet.arc.io"
arc_testnet_quicknode = "https://rpc.quicknode.testnet.arc.io"

# Arc Testnet Explorer runs Blockscout.
[etherscan]
arc_testnet = { key = "", chain = 5042002, url = "https://testnet.arcscan.app/api/" }
